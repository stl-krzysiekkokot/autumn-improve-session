<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autumn show and tell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bark:#2b1a12;
    --bark-deep:#1c110b;
    --parchment:#f3e6d1;
    --rust:#c9622b;
    --pumpkin:#e8873a;
    --gold:#e0a83d;
    --leaf-red:#a83b2f;
    --moss:#5c6b3f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(224,168,61,0.18), transparent 55%),
      radial-gradient(ellipse at 85% 110%, rgba(168,59,47,0.20), transparent 50%),
      var(--bark-deep);
    font-family:'Nunito Sans', sans-serif;
    color:var(--parchment);
  }
  .app{
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2.5vh 4vw;
  }
  .title{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1.4rem, 3.2vh, 2.6rem);
    text-align:center;
    max-width:900px;
    line-height:1.25;
    margin:0 0 0.5vh;
    color:var(--parchment);
  }
  .title em{
    font-style:italic;
    color:var(--gold);
  }
  .subtitle{
    font-size:clamp(0.75rem, 1.6vh, 0.95rem);
    color:rgba(243,230,209,0.6);
    margin:0 0 2.2vh;
    text-align:center;
    letter-spacing:0.01em;
    max-width:700px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, minmax(150px, 220px));
    grid-template-rows:repeat(3, minmax(120px, 190px));
    gap:min(1.6vh, 1.6vw);
    width:100%;
    max-width:820px;
    flex:0 1 auto;
  }
  .card{
    perspective:1200px;
  }
  .card-btn{
    all:unset;
    display:block;
    width:100%;
    height:100%;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.6s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    border-radius:14px;
  }
  .card.flipped .card-inner{
    transform:rotateY(180deg);
  }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .front{
    background:linear-gradient(160deg, #4a2f1d, #362213);
    border:1px solid rgba(224,168,61,0.25);
  }
  .front svg{
    width:64%;
    height:64%;
    filter:blur(13px);
    opacity:0.55;
  }
  .front .hint{
    position:absolute;
    bottom:14px;
    font-size:0.72rem;
    letter-spacing:0.06em;
    color:rgba(243,230,209,0.5);
  }
  .back{
    transform:rotateY(180deg);
    background:var(--parchment);
    color:var(--bark-deep);
    padding:1rem;
  }
  .back svg{
    width:58%;
    height:58%;
    margin-bottom:0.6rem;
  }
  .back .label{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.05rem;
    text-align:center;
  }
  @media (max-height: 700px){
    .subtitle{ margin-bottom:1.4vh; }
  }
</style>
</head>
<body>
<div class="app">
  <h1 class="title">You just found a <em>hidden usecase</em>.</h1>
  <p class="subtitle">Everyone thought they knew how to use this. But you found the real usecase — now you want to share it. Tap a card, then talk for one to two minutes.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const items = [
  { name: "the falling leaves", svg: `<svg viewBox="0 0 100 100">
      <g transform="translate(28,28) rotate(-10)"><path d="M0 30 C-10 18 -8 2 0 -8 C8 2 10 18 0 30 Z" fill="#a83b2f"/><path d="M0 -8 L0 30" stroke="#7a2a20" stroke-width="2"/><path d="M0 8 L-6 2 M0 16 L6 10" stroke="#7a2a20" stroke-width="1.5"/></g>
      <g transform="translate(66,40) rotate(18) scale(0.85)"><path d="M0 30 C-10 18 -8 2 0 -8 C8 2 10 18 0 30 Z" fill="#e0a83d"/><path d="M0 -8 L0 30" stroke="#a87b1f" stroke-width="2"/></g>
      <g transform="translate(46,66) rotate(-25) scale(0.7)"><path d="M0 30 C-10 18 -8 2 0 -8 C8 2 10 18 0 30 Z" fill="#c9622b"/><path d="M0 -8 L0 30" stroke="#8a4418" stroke-width="2"/></g>
    </svg>` },
  { name: "the chestnuts", svg: `<svg viewBox="0 0 100 100">
      <path d="M50 10 C30 10 16 26 20 40 C14 42 12 50 18 54 C12 60 16 70 26 70 C24 78 32 86 42 82 C46 90 58 90 62 82 C72 86 80 78 78 70 C88 70 92 60 86 54 C92 50 90 42 84 40 C88 26 70 10 50 10 Z" fill="#5c6b3f"/>
      <ellipse cx="50" cy="55" rx="22" ry="19" fill="#8a5a34"/>
      <path d="M30 45 C38 32 62 32 70 45 C58 40 42 40 30 45 Z" fill="#c9a35a"/>
      <ellipse cx="50" cy="58" rx="5" ry="4" fill="#3f2a17"/>
    </svg>` },
  { name: "the pumpkin", svg: `<svg viewBox="0 0 100 100"><path d="M50 20 C22 20 14 46 16 62 C18 82 34 92 50 92 C66 92 82 82 84 62 C86 46 78 20 50 20 Z" fill="#e8873a"/><path d="M50 20 C44 20 40 34 40 56 C40 78 44 92 50 92" stroke="#c9622b" stroke-width="2" fill="none"/><path d="M60 20 C62 34 62 78 60 92" stroke="#c9622b" stroke-width="2" fill="none"/><rect x="46" y="8" width="8" height="14" rx="3" fill="#5c6b3f"/></svg>` },
  { name: "the wild mushrooms", svg: `<svg viewBox="0 0 100 100">
      <path d="M50 20 C28 20 16 40 20 48 C34 40 66 40 80 48 C84 40 72 20 50 20 Z" fill="#a83b2f"/>
      <circle cx="38" cy="32" r="4" fill="#f3e6d1"/><circle cx="58" cy="28" r="3.5" fill="#f3e6d1"/><circle cx="66" cy="40" r="4" fill="#f3e6d1"/>
      <rect x="42" y="46" width="16" height="34" rx="6" fill="#f3e6d1"/>
      <path d="M30 82 C40 78 60 78 70 82" stroke="#6b4226" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>` },
  { name: "halloween night", svg: `<svg viewBox="0 0 100 100">
      <path d="M50 18 C26 18 16 42 18 58 C20 80 34 90 50 90 C66 90 80 80 82 58 C84 42 74 18 50 18 Z" fill="#e8873a"/>
      <path d="M50 18 C44 18 40 32 40 54 C40 76 44 90 50 90" stroke="#c9622b" stroke-width="2" fill="none"/>
      <path d="M60 18 C62 32 62 76 60 90" stroke="#c9622b" stroke-width="2" fill="none"/>
      <path d="M32 52 L40 60 L32 66 Z" fill="#2b1a12"/>
      <path d="M68 52 L60 60 L68 66 Z" fill="#2b1a12"/>
      <path d="M36 76 L44 66 L50 74 L56 66 L64 76 Z" fill="#2b1a12"/>
      <rect x="46" y="6" width="8" height="12" rx="3" fill="#5c6b3f"/>
    </svg>` },
  { name: "the rain", svg: `<svg viewBox="0 0 100 100">
      <path d="M22 46 C10 46 8 30 22 26 C24 14 44 10 52 20 C64 14 78 24 74 38 C88 38 88 54 74 54 L28 54 C24 54 22 50 22 46 Z" fill="#8a8a94"/>
      <path d="M30 62 L26 74" stroke="#378ADD" stroke-width="4" stroke-linecap="round"/>
      <path d="M50 62 L46 74" stroke="#378ADD" stroke-width="4" stroke-linecap="round"/>
      <path d="M70 62 L66 74" stroke="#378ADD" stroke-width="4" stroke-linecap="round"/>
      <path d="M40 78 L36 88" stroke="#378ADD" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 78 L56 88" stroke="#378ADD" stroke-width="3" stroke-linecap="round"/>
    </svg>` },
  { name: "the scarf", svg: `<svg viewBox="0 0 100 100">
      <path d="M12 24 Q50 6 88 24 L88 34 Q50 18 12 34 Z" fill="#a83b2f"/>
      <path d="M12 30 Q50 14 88 30" stroke="#7a2a20" stroke-width="1.5" fill="none"/>
      <rect x="16" y="24" width="10" height="4" fill="#e0a83d"/>
      <rect x="40" y="18" width="10" height="4" fill="#e0a83d"/>
      <rect x="64" y="20" width="10" height="4" fill="#e0a83d"/>
      <path d="M26 30 C24 50 34 58 30 74 C40 80 46 74 44 62 C48 70 46 82 38 88 L54 88 C50 76 52 60 46 50 C42 40 32 34 26 30 Z" fill="#a83b2f"/>
      <rect x="30" y="66" width="20" height="5" fill="#e0a83d"/>
      <rect x="34" y="78" width="18" height="5" fill="#e0a83d"/>
    </svg>` },
  { name: "the shorter days", svg: `<svg viewBox="0 0 100 100">
      <path d="M50 12 A38 38 0 1 0 50 88 A30 30 0 1 1 50 12 Z" fill="#e0a83d"/>
      <circle cx="72" cy="26" r="2.5" fill="#f3e6d1"/>
      <circle cx="80" cy="40" r="2" fill="#f3e6d1"/>
      <circle cx="70" cy="52" r="1.8" fill="#f3e6d1"/>
      <rect x="10" y="80" width="80" height="6" rx="3" fill="#5c6b3f"/>
    </svg>` },
  { name: "the mug of tea", svg: `<svg viewBox="0 0 100 100"><path d="M28 42 h40 v26 a20 20 0 0 1 -40 0 Z" fill="#f3e6d1" stroke="#6b4226" stroke-width="3"/><path d="M68 48 c14 0 14 20 0 20" stroke="#6b4226" stroke-width="4" fill="none"/><path d="M40 20 q4 8 0 12 M50 18 q4 8 0 12 M60 20 q4 8 0 12" stroke="#c9622b" stroke-width="2" fill="none" stroke-linecap="round"/></svg>` }
];

const grid = document.getElementById('grid');

function render(list){
  grid.innerHTML = '';
  list.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <button class="card-btn" aria-label="Reveal ${item.name}">
        <div class="card-inner">
          <div class="face front">
            ${item.svg}
            <span class="hint">tap to reveal</span>
          </div>
          <div class="face back">
            ${item.svg}
            <span class="label">${item.name}</span>
          </div>
        </div>
      </button>`;
    card.querySelector('.card-btn').addEventListener('click', () => {
      card.classList.toggle('flipped');
    });
    grid.appendChild(card);
  });
}

render(items);
</script>
</body>
</html>
